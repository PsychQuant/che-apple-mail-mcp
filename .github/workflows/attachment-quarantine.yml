name: Attachment quarantine (macOS)

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/attachment-quarantine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record native environment
        run: |
          sw_vers
          uname -m
          swift --version
          git rev-parse HEAD
      - name: Regression tests and native xattr observations
        run: swift test --filter AttachmentQuarantineTests
      - name: Existing containment and writer tests
        run: swift test --skip-build --filter 'AttachmentDestinationTests|AttachmentContainmentIntegrationTests|RaceFreeFileWriterTests|SaveAttachment'
      - name: Full Swift suite (live Mail remains opt-in)
        id: full
        run: swift test --skip-build
      # Diagnose the existing pure-list test's Mail preflight dependency on the
      # untouched PR base. The full-suite failure remains a failure; no skip or
      # continue-on-error hides it, and Mail is never launched to satisfy it.
      - name: Compare Mail-dependent failure with PR base
        if: failure() && steps.full.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/quarantine-base" "$BASE_SHA"
          swift test --package-path "$RUNNER_TEMP/quarantine-base" --filter 'SpecialMailboxesScriptBuilderTests.test_runScriptAsList_preservesEmptyStringPositions'
